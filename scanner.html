<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/html5-qrcode"></script>
</head>
<body>

<h2>出席スキャン</h2>
<div id="reader" style="width:300px"></div>

<script>
const GAS_URL = "https://script.google.com/a/macros/iwakuni.ac.jp/s/AKfycbygOhJLWhWDprxcP0VYc8FCkbbca8S7AFNPwWsyghfTg4GA2PlOPe6Gt9NtE7okXp3D/exec";

function onScanSuccess(decodedText) {
  try {
    const data = JSON.parse(decodedText);

    fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(res => {
      alert("出席登録：" + res);
    });

  } catch (e) {
    alert("QR形式が違います");
  }
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(err => {
  alert("カメラ起動失敗：" + err);
});
</script>

</body>
</html>

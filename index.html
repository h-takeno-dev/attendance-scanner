<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<h2>出席スキャン</h2>
<div id="reader" style="width:300px"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwXjbH-vpFT8K61o-cRuBpw6KnLvXrj5w_ni8sVSToKIJarY9uwQDEYPqGoyYrxDiqB/exec";

function onScanSuccess(decodedText) {
  try {
    const data = JSON.parse(decodedText);

    // フォーム作成
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "https://script.google.com/macros/s/AKfycbwXjbH-vpFT8K61o-cRuBpw6KnLvXrj5w_ni8sVSToKIJarY9uwQDEYPqGoyYrxDiqB/exec";

    for (const key in data) {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = key;
      input.value = data[key];
      form.appendChild(input);
    }

    document.body.appendChild(form);
    form.submit();

  } catch (e) {
    alert("QR形式が違います");
  }
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(err => {
  alert("カメラ起動失敗：" + err);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<h2>出席スキャン</h2>
<div id="reader" style="width:300px"></div>

<script>
function onScanSuccess(decodedText) {
  try {
    const data = JSON.parse(decodedText);

    const GAS_URL = "https://script.google.com/macros/s/AKfycbwXjbH-vpFT8K61o-cRuBpw6KnLvXrj5w_ni8sVSToKIJarY9uwQDEYPqGoyYrxDiqB/exec";

    fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    })

    .then(res => res.text())
    .then(res => {
      alert("出席登録：" + res);
    });

  } catch (e) {
    alert("QRが不正です");
  }
}

const html5QrCode = new Html5QrCode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  onScanSuccess
);
</script>

</body>
</html>

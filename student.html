<!DOCTYPE html>
<html>
<head>
  https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js
</head>
<body>

<h2>出席QR</h2>

<button onclick="loadUser()">QR表示</button>

<br><br>
<img id="qr">

<script>

let subjectData = JSON.parse(localStorage.getItem("subject"));

function loadUser() {

  google.script.run.withSuccessHandler(function(user) {

    if (!subjectData) {
      alert("先に科目QRを読み取ってください");
      return;
    }

    const data = {
      studentId: user.studentId,
      name: user.name,
      subjectId: subjectData.subjectId,
      subjectName: subjectData.subjectName,
      time: new Date().toISOString()
    };

    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
      encodeURIComponent(JSON.stringify(data));

    document.getElementById("qr").src = qrUrl;

  }).getUserInfo();
}

function readSubjectQR() {
  const html5QrCode = new Html5QrCode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      const subject = JSON.parse(decodedText);

      localStorage.setItem("subject", JSON.stringify(subject));

      alert("科目登録：" + subject.subjectName);

      html5QrCode.stop();
    }
  );
}
</script>

</body>
</html>
